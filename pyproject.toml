[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spbin"
dynamic = ["version"]
description = "Download and fit stellar spectral energy distributions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{name = "Jiadong Li"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
jax = ["jax>=0.8.2", "optimistix>=0.1.0"]
dust = ["dustmaps>=1.0.13", "astropy>=6"]
spherex = ["uv>=0.7"]
download = ["astropy>=6", "astroquery>=0.4.7", "gaiaxpy>=2.1", "requests>=2.31", "pyvo>=1.5"]
notebook = ["jupyterlab", "ipykernel"]
test = ["pytest>=7", "ruff>=0.8", "astropy>=6", "requests>=2.31", "pyvo>=1.5"]

[project.urls]
Repository = "https://github.com/jiadonglee/spbin"

[tool.setuptools.dynamic]
version = {attr = "spbin.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spbin = ["models/*.npz", "models/*.txt", "models/stellar/*.npz", "models/stellar/*.json", "models/hot/*.npz", "models/hot/*.json", "models/pms/*.npz", "models/pms/*.json", "models/giant/*.npz", "models/giant/*.json", "models/subdwarf/*.npz", "models/subdwarf/*.json", "models/whitedwarf/*.npz", "models/whitedwarf/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
extend-exclude = ["build", "reports"]

[tool.ruff.lint]
ignore = ["E701", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/test_jax*.py" = ["E402"]
